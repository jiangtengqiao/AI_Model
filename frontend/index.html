<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贤智AI - 快速测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        .status {
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        .link {
            display: block;
            padding: 15px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            transition: background 0.3s;
        }
        .link:hover {
            background: #5568d3;
        }
        .link.secondary {
            background: #6c757d;
        }
        .link.secondary:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 贤智AI 测试页面</h1>
        
        <div id="status" class="status">
            正在检查服务状态...
        </div>
        
        <div class="info">
            <strong>📌 使用说明：</strong>
            <ul style="margin: 10px 0 0 20px; line-height: 1.8;">
                <li>API 文档：查看完整的 API 接口文档</li>
                <li>前端应用：完整的聊天界面（需要配置 API Key）</li>
                <li>后端服务：确保正在运行中</li>
            </ul>
        </div>
        
        <div class="links">
            <a href="/docs" target="_blank" class="link">📚 API 文档</a>
            <a href="/" target="_blank" class="link">💬 打开前端应用</a>
            <a href="/api/health" target="_blank" class="link secondary">❤️ 健康检查</a>
        </div>
    </div>

    <script>
        async function checkStatus() {
            const statusDiv = document.getElementById('status');
            try {
                const response = await fetch('/api/health');
                if (response.ok) {
                    const data = await response.json();
                    statusDiv.className = 'status success';
                    statusDiv.innerHTML = `
                        <h3>✅ 服务状态正常</h3>
                        <p style="margin-top: 10px;">
                            <strong>状态：</strong> ${data.status}<br>
                            <strong>时间：</strong> ${new Date().toLocaleString('zh-CN')}
                        </p>
                    `;
                } else {
                    throw new Error('HTTP ' + response.status);
                }
            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.innerHTML = `
                    <h3>❌ 服务连接失败</h3>
                    <p style="margin-top: 10px;">
                        <strong>错误：</strong> ${error.message}<br>
                        <strong>说明：</strong> 后端服务可能未启动或无法访问
                    </p>
                `;
            }
        }
        
        // 页面加载时检查状态
        window.onload = checkStatus;
        
        // 每5秒检查一次
        setInterval(checkStatus, 5000);
    </script>
</body>
</html>
